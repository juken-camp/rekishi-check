<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歴史チェック ｜ JUKEN CAMP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700&family=Shippori+Mincho:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f0e8;
            --surface: #faf7f2;
            --surface2: #ffffff;
            --primary: #1a4a3a;
            --primary-light: #2d6b55;
            --primary-muted: rgba(26,74,58,0.08);
            --accent: #c4973a;
            --accent-light: #e8be6a;
            --danger: #c0392b;
            --danger-light: #e74c3c;
            --success: #1a6b45;
            --success-light: #27ae60;
            --text: #1c1a17;
            --text-muted: #6b6459;
            --text-light: #9e9589;
            --border: rgba(26,74,58,0.15);
            --shadow: 0 2px 16px rgba(26,74,58,0.12);
            --shadow-lg: 0 8px 32px rgba(26,74,58,0.18);
            --radius: 12px;
            --radius-lg: 18px;
            --font-serif: 'Shippori Mincho', 'Noto Serif JP', serif;
            --font-body: 'Noto Serif JP', 'Hiragino Mincho ProN', serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            background-image: 
                radial-gradient(ellipse at 20% 10%, rgba(196,151,58,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 90%, rgba(26,74,58,0.08) 0%, transparent 50%);
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            color: var(--text);
        }

        .container {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            padding: 10px 14px;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 18px 0 12px;
            position: relative;
        }

        .title {
            font-family: var(--font-serif);
            font-size: 26px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.12em;
            margin-bottom: 4px;
            position: relative;
            display: inline-block;
        }

        .title::after {
            content: '';
            display: block;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            margin-top: 4px;
        }

        /* Title badge decoration */
        .title::before {
            content: '◆';
            font-size: 10px;
            color: var(--accent);
            display: inline-block;
            margin-right: 8px;
            vertical-align: middle;
            opacity: 0.7;
        }

        .subtitle {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            font-weight: 600;
        }

        /* Floating buttons */
        .floating-menu {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 1000;
            background: var(--primary);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            cursor: pointer;
            font-size: 18px;
            transition: all 0.25s ease;
            border: 2px solid rgba(255,255,255,0.15);
        }

        .floating-menu:hover {
            transform: scale(1.08);
            background: var(--primary-light);
            box-shadow: var(--shadow-lg);
        }

        .floating-back {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1000;
            background: var(--surface2);
            border: 2px solid var(--border);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            cursor: pointer;
            font-size: 16px;
            transition: all 0.25s ease;
            color: var(--primary);
        }

        .floating-back:hover {
            transform: scale(1.08);
            background: var(--primary-muted);
            border-color: var(--primary);
        }

        /* Screen visibility */
        .menu-screen { display: block; }
        .subcategory-screen { display: none; }
        .game-mode-screen { display: none; }
        .game-screen { display: none; }
        .timeline-screen { display: none; }
        .result-screen { display: none; }

        /* Category section */
        .category-section { margin-bottom: 20px; }

        .category-header {
            background: var(--primary);
            color: #f5f0e8;
            padding: 11px 18px;
            border-radius: var(--radius);
            text-align: center;
            margin-bottom: 12px;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 3px 12px rgba(26,74,58,0.2);
            position: relative;
            overflow: hidden;
        }

        .category-header::before {
            content: '';
            position: absolute;
            left: 0; top: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(196,151,58,0.6), transparent);
        }

        .category-header:hover {
            background: var(--primary-light);
            transform: translateY(-1px);
            box-shadow: 0 5px 18px rgba(26,74,58,0.28);
        }

        /* Theme grid */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 7px;
            margin-bottom: 16px;
        }

        .theme-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 4px;
            text-align: center;
            cursor: pointer;
            transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 1px 6px rgba(26,74,58,0.07);
            position: relative;
            overflow: hidden;
            min-height: 64px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .theme-card:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 6px 20px rgba(26,74,58,0.15);
            border-color: var(--accent);
            background: #fffef9;
        }

        .theme-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(196,151,58,0.08) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .theme-card:hover::after { opacity: 1; }

        .theme-emoji {
            font-size: 17px;
            margin-bottom: 3px;
        }

        .theme-title {
            font-size: 9px;
            font-weight: 700;
            color: var(--primary);
            line-height: 1.2;
            letter-spacing: 0.02em;
        }

        /* Subcategory card */
        .subcategory-card {
            border-color: rgba(26,74,58,0.12);
        }

        .subcategory-card:hover {
            border-color: var(--primary);
        }

        /* Mode grid */
        .mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            padding: 16px 0;
        }

        .mode-card {
            background: var(--surface2);
            border-radius: var(--radius-lg);
            padding: 22px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: var(--shadow);
            border: 2px solid transparent;
        }

        .mode-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }

        .mode-card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #f0ece4;
        }

        .mode-card.disabled:hover {
            transform: none;
            box-shadow: var(--shadow);
            border-color: transparent;
        }

        .mode-emoji {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .mode-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 5px;
            letter-spacing: 0.05em;
        }

        .mode-description {
            font-size: 10px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Timeline */
        .timeline-container { padding: 12px 0; }

        .timeline-instructions {
            background: var(--surface2);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 14px;
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .timeline-game-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .timeline-slots {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .timeline-slot {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 9px;
            min-height: 58px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            position: relative;
            font-size: 10px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
        }

        .timeline-slot.filled {
            background: rgba(26,74,58,0.06);
            border-color: var(--primary-light);
            color: var(--text);
            font-weight: 700;
        }

        .timeline-slot.filled:hover {
            background: rgba(26,74,58,0.1);
        }

        .timeline-slot.correct {
            background: linear-gradient(135deg, rgba(26,107,69,0.12), rgba(39,174,96,0.18));
            border-color: var(--success-light);
            box-shadow: 0 0 16px rgba(39,174,96,0.3);
            animation: correctPulse 2s infinite;
        }

        .timeline-slot.wrong {
            background: linear-gradient(135deg, rgba(192,57,43,0.08), rgba(231,76,60,0.15));
            border-color: var(--danger-light);
            box-shadow: 0 0 16px rgba(231,76,60,0.3);
            animation: wrongPulse 2s infinite;
        }

        .timeline-slot .slot-number {
            position: absolute;
            left: 5px;
            top: 3px;
            font-size: 8px;
            color: var(--text-light);
            font-family: monospace;
        }

        .timeline-slot-term {
            font-weight: 700;
            margin-bottom: 2px;
            font-size: 10px;
            color: var(--primary);
        }

        .timeline-slot-desc {
            font-size: 8px;
            color: var(--text-muted);
            line-height: 1.2;
        }

        .timeline-cards {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .timeline-card {
            background: var(--surface2);
            border-radius: 9px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 2px 8px rgba(26,74,58,0.09);
            border: 2px solid transparent;
            user-select: none;
            font-size: 10px;
            line-height: 1.3;
            min-height: 58px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .timeline-card:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 14px rgba(26,74,58,0.18);
            border-color: var(--accent);
        }

        .timeline-card.selected {
            background: rgba(196,151,58,0.08);
            border-color: var(--accent);
            transform: scale(1.02);
        }

        .timeline-card.used {
            opacity: 0.25;
            pointer-events: none;
        }

        .timeline-card.correct {
            background: rgba(26,107,69,0.08);
            border-color: var(--success-light);
            animation: correctPlacement 0.6s ease;
        }

        .timeline-card.wrong {
            animation: wrongPlacement 0.6s ease;
        }

        .timeline-card-term {
            font-weight: 700;
            margin-bottom: 3px;
            font-size: 10px;
            color: var(--primary);
        }

        .timeline-card-desc {
            font-size: 8px;
            color: var(--text-muted);
            line-height: 1.2;
        }

        /* Game board */
        .game-board { padding: 16px 0; }

        .score-board {
            background: var(--surface2);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin-bottom: 16px;
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .score {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 0.05em;
        }

        .cards-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
            margin-top: 16px;
        }

        .card-column {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .card {
            background: var(--surface2);
            border-radius: var(--radius);
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
            box-shadow: 0 2px 8px rgba(26,74,58,0.09);
            border: 2px solid var(--border);
            min-height: 68px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            opacity: 0;
            transition: opacity 0.2s;
        }

        .card:hover {
            transform: scale(1.04);
            box-shadow: 0 5px 18px rgba(26,74,58,0.18);
            border-color: var(--primary);
        }

        .card:hover::before { opacity: 1; }

        .card.selected {
            border-color: var(--accent);
            background: rgba(196,151,58,0.06);
            transform: scale(1.04);
            animation: pulse 1.2s infinite;
        }

        .card.selected::before { opacity: 1; background: linear-gradient(90deg, var(--accent), var(--accent-light)); }

        .card.matched {
            background: rgba(26,107,69,0.07);
            border-color: var(--success-light);
            animation: superMatch 1.2s ease;
        }

        .card.matched::before {
            opacity: 1;
            background: linear-gradient(90deg, var(--success), var(--success-light));
        }

        .card.wrong {
            animation: wrongMatch 0.8s ease;
        }

        .card-text {
            font-size: 12px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.4;
            z-index: 2;
            letter-spacing: 0.03em;
        }

        /* Result screen */
        .result-content {
            text-align: center;
            padding: 40px 20px;
        }

        .result-emoji {
            font-size: 52px;
            margin-bottom: 20px;
            animation: celebration 2s infinite;
        }

        .result-title {
            font-family: var(--font-serif);
            font-size: 22px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            letter-spacing: 0.1em;
        }

        .result-score {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 28px;
            line-height: 1.7;
            white-space: pre-line;
        }

        .btn {
            background: var(--primary);
            color: #f5f0e8;
            border: none;
            border-radius: 30px;
            padding: 13px 28px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 3px 14px rgba(26,74,58,0.3);
            margin: 8px;
            letter-spacing: 0.06em;
            font-family: var(--font-body);
        }

        .btn:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(26,74,58,0.35);
        }

        /* Progress bar */
        .progress-bar {
            background: rgba(26,74,58,0.1);
            height: 6px;
            border-radius: 3px;
            margin: 12px 0 2px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, var(--primary), var(--accent));
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
            width: 0%;
        }

        /* Effects */
        .combo-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10000;
            font-size: 28px;
            font-weight: 700;
            font-family: var(--font-serif);
            color: var(--accent);
            text-shadow: 2px 2px 0px var(--primary), -2px -2px 0px rgba(255,255,255,0.5);
            animation: comboExplosion 2s ease-out forwards;
            pointer-events: none;
        }

        .mega-success {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle, rgba(196,151,58,0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: 9998;
            animation: megaFlash 1s ease-out forwards;
        }

        .particle {
            position: fixed;
            width: 5px; height: 5px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
        }

        .laser-beam {
            position: fixed;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), var(--primary), transparent);
            border-radius: 1px;
            pointer-events: none;
            z-index: 9999;
            animation: laserSweep 0.8s ease-out forwards;
        }

        .screen-shake { animation: screenShake 0.5s ease-in-out; }

        .starburst {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            animation: starburstExplosion 1.5s ease-out forwards;
        }

        .rainbow-ring {
            position: fixed;
            border: 6px solid transparent;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            animation: rainbowRing 2s ease-out forwards;
        }

        .mega-firework {
            position: fixed;
            width: 16px; height: 16px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
        }

        .instant-correct { animation: instantCorrectEffect 1.5s ease-out forwards; }
        .instant-wrong { animation: instantWrongEffect 1s ease-out forwards; }

        .mega-explosion {
            position: fixed;
            width: 180px; height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(196,151,58,0.6) 0%, rgba(26,74,58,0.2) 50%, transparent 100%);
            pointer-events: none;
            z-index: 9999;
            animation: megaExplosionEffect 2s ease-out forwards;
        }

        /* Animations */
        @keyframes comboExplosion {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-180deg); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.4) rotate(0deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 0; }
        }

        @keyframes megaFlash {
            0% { opacity: 0; }
            20% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes laserSweep {
            0% { width: 0; left: 50%; }
            100% { width: 100vw; left: 0; }
        }

        @keyframes screenShake {
            0%, 100% { transform: translateX(0); }
            10% { transform: translateX(-8px); }
            20% { transform: translateX(8px); }
            30% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            50% { transform: translateX(-4px); }
            60% { transform: translateX(4px); }
            70% { transform: translateX(-3px); }
            80% { transform: translateX(3px); }
            90% { transform: translateX(-1px); }
        }

        @keyframes starburstExplosion {
            0% { transform: scale(0) rotate(0deg); opacity: 1; }
            100% { transform: scale(3) rotate(360deg); opacity: 0; }
        }

        @keyframes rainbowRing {
            0% { width: 0; height: 0; border-color: var(--primary); opacity: 1; }
            50% { border-color: var(--accent); }
            100% { width: 280px; height: 280px; border-color: transparent; opacity: 0; }
        }

        @keyframes megaFireworkExplosion {
            0% { transform: scale(0); opacity: 1; }
            50% { transform: scale(2); opacity: 1; }
            100% { transform: scale(4); opacity: 0; }
        }

        @keyframes instantCorrectEffect {
            0% { transform: scale(1); filter: brightness(1); }
            25% { transform: scale(1.18); filter: brightness(1.3); box-shadow: 0 0 24px rgba(39,174,96,0.6); }
            50% { transform: scale(1.08); filter: brightness(1.15); }
            100% { transform: scale(1.04); filter: brightness(1.05); }
        }

        @keyframes instantWrongEffect {
            0% { transform: scale(1) rotate(0deg); }
            20% { transform: scale(1.08) rotate(-4deg); box-shadow: 0 0 24px rgba(231,76,60,0.6); }
            40% { transform: scale(0.96) rotate(4deg); }
            60% { transform: scale(1.04) rotate(-2deg); }
            80% { transform: scale(0.99) rotate(2deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        @keyframes megaExplosionEffect {
            0% { transform: scale(0); opacity: 1; }
            50% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(3); opacity: 0; }
        }

        @keyframes correctPulse {
            0%, 100% { box-shadow: 0 0 12px rgba(39,174,96,0.3); transform: scale(1); }
            50% { box-shadow: 0 0 28px rgba(39,174,96,0.6); transform: scale(1.02); }
        }

        @keyframes wrongPulse {
            0%, 100% { box-shadow: 0 0 12px rgba(231,76,60,0.3); transform: scale(1); }
            50% { box-shadow: 0 0 28px rgba(231,76,60,0.6); transform: scale(1.02); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-4px); }
            60% { transform: translateY(-2px); }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(196,151,58,0.6); }
            70% { box-shadow: 0 0 0 8px rgba(196,151,58,0); }
            100% { box-shadow: 0 0 0 0 rgba(196,151,58,0); }
        }

        @keyframes superMatch {
            0% { transform: scale(1); }
            20% { transform: scale(1.28) rotate(-3deg); }
            40% { transform: scale(0.92) rotate(3deg); }
            60% { transform: scale(1.15) rotate(-2deg); }
            80% { transform: scale(0.97) rotate(1deg); }
            100% { transform: scale(1.04) rotate(0deg); }
        }

        @keyframes wrongMatch {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            10% { transform: translateX(-8px) rotate(-4deg); background: rgba(231,76,60,0.1); }
            20% { transform: translateX(8px) rotate(4deg); background: rgba(231,76,60,0.15); }
            30% { transform: translateX(-6px) rotate(-2deg); }
            40% { transform: translateX(6px) rotate(2deg); }
            50% { transform: translateX(-4px); }
            60% { transform: translateX(4px); }
        }

        let audioContext = null;

        function initAudio() {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
            } catch (e) {
                console.log('Audio not supported');
            }
        }

        // 🎼 多重音色システム
        function playComplexSound(frequencies, duration, type = 'sine', volume = 0.3) {
            try {
                initAudio();
                if (!audioContext) return;

                frequencies.forEach((freq, index) => {
                    setTimeout(() => {
                        const oscillator = audioContext.createOscillator();
                        const gainNode = audioContext.createGain();
                        
                        oscillator.connect(gainNode);
                        gainNode.connect(audioContext.destination);
                        
                        oscillator.frequency.setValueAtTime(freq, audioContext.currentTime);
                        oscillator.type = type;
                        
                        gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                        
                        oscillator.start(audioContext.currentTime);
                        oscillator.stop(audioContext.currentTime + duration);
                    }, index * 50);
                });
            } catch (e) {
                console.log('Complex audio playback failed:', e);
            }
        }

        function playSound(frequency, duration, type = 'sine') {
            try {
                initAudio();
                if (!audioContext) return;

                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
                oscillator.type = type;
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration);
            } catch (e) {
                console.log('Audio playback failed:', e);
            }

        // ユーティリティ関数
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // 時代順並べが可能かチェック
        function canDoTimeline(categoryKey, subcategoryKey = '') {
            try {
                // 無効化対象のチェック
                if (subcategoryKey === 'sekai' && categoryKey === 'jinbutsu') return false; // 世界の人物
                if (subcategoryKey === 'meiji' && categoryKey === 'seiji') return false; // 明治維新
                
                if (subcategoryKey) {
                    return CHRONOLOGICAL_ORDERS.hasOwnProperty(subcategoryKey);
                } else {
                    return CHRONOLOGICAL_ORDERS.hasOwnProperty(categoryKey);
                }
            } catch (error) {
                console.error('Error checking timeline capability:', error);
                return false;
            }
        }

                if (gameState.screenHistory[gameState.screenHistory.length - 1] !== screenId) {
                    gameState.screenHistory.push(screenId);
                }
                gameState.currentScreen = screenId;
                updateBackButton();
            } catch (error) {
                console.error('Error pushing screen:', error);
            }
        }

            try {
                if (gameState.screenHistory.length > 1) {
                    gameState.screenHistory.pop();
                    const previousScreen = gameState.screenHistory[gameState.screenHistory.length - 1];
                    gameState.currentScreen = previousScreen;
                    return previousScreen;
                }
                return 'menuScreen';
            } catch (error) {
                console.error('Error popping screen:', error);
                return 'menuScreen';
            }
        }

        // マッチングゲーム開始
        function startMatchingGame() {
            try {
                gameState.gameMode = 'matching';
                gameState.comboCount = 0;
                gameState.maxCombo = 0;
                gameState.perfectRun = true;
                gameState.startTime = Date.now();
                
                if (gameState.currentSubcategory) {
                    let category;
                    if (gameState.currentTheme === 'jidaiBunkaBunmei') {
                        category = createJidaiBunkaBunmeiData();
                    } else {
                        category = REKISHI_DATA[gameState.currentTheme];
                    }
                    
                    const subcategory = category.subcategories[gameState.currentSubcategory];
                    gameState.currentData = [...subcategory.terms];
                    
                    const icon = SUBCATEGORY_ICONS[gameState.currentSubcategory] || category.emoji;
                    initializeMatchingGame(`${icon}${subcategory.title}`);
                } else {
                    if (gameState.currentTheme === 'jidaiBunkaBunmei') {
                        gameState.currentData = getAllDataFromCategory(gameState.currentTheme, {jidaiBunkaBunmei: createJidaiBunkaBunmeiData()});
                        const icon = CATEGORY_ICONS[gameState.currentTheme];
                        initializeMatchingGame(`${icon}時代・文化・文明`);
                    } else {
                        gameState.currentData = getAllDataFromCategory(gameState.currentTheme);
                        const category = REKISHI_DATA[gameState.currentTheme];
                        const icon = CATEGORY_ICONS[gameState.currentTheme] || category.emoji;
                        initializeMatchingGame(`${icon}${category.title}`);
                    }
                }
            } catch (error) {
                console.error('Error starting matching game:', error);
            }
        }

        // タイムラインゲーム開始
        function startTimelineGame() {
            try {
                if (!canDoTimeline(gameState.currentTheme, gameState.currentSubcategory)) {
                    alert('このカテゴリでは時代順並べはできません');
                    return;
                }
                
                gameState.gameMode = 'timeline';
                gameState.comboCount = 0;
                gameState.maxCombo = 0;
                gameState.perfectRun = true;
                gameState.startTime = Date.now();
                gameState.timelineCompleted = false; // 🆕 追加
                
                if (gameState.currentSubcategory) {
                    gameState.currentOrderKey = gameState.currentSubcategory;
                    
                    let category;
                    if (gameState.currentTheme === 'jidaiBunkaBunmei') {
                        category = createJidaiBunkaBunmeiData();
                    } else {
                        category = REKISHI_DATA[gameState.currentTheme];
                    }
                    
                    const subcategory = category.subcategories[gameState.currentSubcategory];
                    gameState.currentData = [...subcategory.terms];
                    
                    const icon = SUBCATEGORY_ICONS[gameState.currentSubcategory] || category.emoji;
                    initializeTimelineGame(`${icon}${subcategory.title}`);
                } else {
                    gameState.currentOrderKey = gameState.currentTheme;
                    if (gameState.currentTheme === 'jidaiBunkaBunmei') {
                        gameState.currentData = getAllDataFromCategory(gameState.currentTheme, {jidaiBunkaBunmei: createJidaiBunkaBunmeiData()});
                        const icon = CATEGORY_ICONS[gameState.currentTheme];
                        initializeTimelineGame(`${icon}時代・文化・文明`);
                    } else {
                        gameState.currentData = getAllDataFromCategory(gameState.currentTheme);
                        const category = REKISHI_DATA[gameState.currentTheme];
                        const icon = CATEGORY_ICONS[gameState.currentTheme] || category.emoji;
                        initializeTimelineGame(`${icon}${category.title}`);
                    }
                }
            } catch (error) {
                console.error('Error starting timeline game:', error);
            }
        }

        // マッチングゲーム初期化
        function initializeMatchingGame(title) {
            try {
                console.log('Initializing matching game with data:', gameState.currentData);
                
                if (!gameState.currentData || gameState.currentData.length === 0) {
                    console.error('No data available for matching game!');
                    alert('データが見つかりません。メニューに戻ります。');
                    showMenu();
                    return;
                }
                
                gameState.currentData = shuffleArray(gameState.currentData);
                
                gameState.score = 0;
                gameState.matchedPairs = 0;
                gameState.totalPairs = gameState.currentData.length;
                gameState.selectedCard = null;
                
                document.getElementById('currentTheme').textContent = title;
                document.getElementById('score').textContent = gameState.score;
                document.getElementById('total').textContent = gameState.totalPairs;
                
                renderMatchingGame();
                showScreen('gameScreen');
            } catch (error) {
                console.error('Error initializing matching game:', error);
            }
        }

        // タイムラインゲーム初期化（全17項目対応）
        function initializeTimelineGame(title) {
            try {
                const orderArray = CHRONOLOGICAL_ORDERS[gameState.currentOrderKey];
                
        // すべてのカテゴリで制限なしに変更
        gameState.timelineData = gameState.currentData.filter(item => 
            orderArray.includes(item.term)
        ); // 制限を完全に削除
                
                if (gameState.timelineData.length === 0) {
                    alert('このカテゴリには時代順データがありません');
                    return;
                }
                
                gameState.timelineScore = 0;
                gameState.selectedTimelineCard = null;
                gameState.timelineSlots = new Array(gameState.timelineData.length).fill(null);
                
                document.getElementById('timelineTheme').textContent = title;
                document.getElementById('timelineScore').textContent = gameState.timelineScore;
                document.getElementById('timelineTotal').textContent = gameState.timelineData.length;
                
                // 説明文を動的に設定
                let instruction = '📅 右のカードをタップして左に順番に並べよう！';
                if (gameState.currentOrderKey === 'jidai' || gameState.currentOrderKey === 'bunka') {
                    instruction = '📅 古い時代から順に右のカードをタップして左に並べよう！';
                } else if (gameState.currentOrderKey === 'chugoku') {
                    instruction = '🐉 中国王朝を古い順に右のカードをタップして左に並べよう！';
                } else if (gameState.currentOrderKey === 'shogun' || gameState.currentOrderKey === 'souri') {
                    instruction = '👑 代順に右のカードをタップして左に並べよう！';
                }
                document.getElementById('timelineInstructions').textContent = instruction;
                
                renderTimelineGame();
                showScreen('timelineScreen');
            } catch (error) {
                console.error('Error initializing timeline game:', error);
            }
        }

        // タイムラインゲーム描画（項目名と説明を両方表示）
        function renderTimelineGame() {
            try {
                const timelineSlots = document.getElementById('timelineSlots');
                const timelineCards = document.getElementById('timelineCards');
                
                timelineSlots.innerHTML = '';
                timelineCards.innerHTML = '';
                
                // スロット作成（左側）
                gameState.timelineData.forEach((_, index) => {
                    const slot = document.createElement('div');
                    slot.className = 'timeline-slot';
                    slot.dataset.index = index;
                    slot.innerHTML = `
                        <div class="slot-number">${index + 1}</div>
                        <div>タップして配置</div>
                    `;
                    
                    // スロットクリックで選択中のカードを配置
                    slot.onclick = () => {
                        if (gameState.selectedTimelineCard && !gameState.timelineSlots[index]) {
                            placeCardInSlot(gameState.selectedTimelineCard, index);
                            playClickSound();
                        }
                    };
                    
                    timelineSlots.appendChild(slot);
                });
                
                // カード作成（右側）- 項目名と説明を両方表示
                const shuffledData = shuffleArray([...gameState.timelineData]);
                shuffledData.forEach((item, index) => {
                    const card = document.createElement('div');
                    card.className = 'timeline-card';
                    card.innerHTML = `
                        <div class="timeline-card-term">${item.term}</div>
                        <div class="timeline-card-desc">${item.description}</div>
                    `;
                    card.dataset.term = item.term;
                    card.dataset.description = item.description;
                    card.dataset.originalIndex = index;
                    
                    // カードクリックで選択
                    card.onclick = () => {
                        selectTimelineCard(card);
                        playClickSound();
                    };
                    
                    timelineCards.appendChild(card);
                });
            } catch (error) {
                console.error('Error rendering timeline game:', error);
            }
        }

        // タイムラインカード選択
        function selectTimelineCard(card) {
            try {
                // 既に使用済みのカードは選択できない
                if (card.classList.contains('used')) return;
                
                // 前の選択を解除
                if (gameState.selectedTimelineCard) {
                    gameState.selectedTimelineCard.classList.remove('selected');
                }
                
                // 新しいカードを選択
                gameState.selectedTimelineCard = card;
                card.classList.add('selected');
            } catch (error) {
                console.error('Error selecting timeline card:', error);
            }
        }

        // 🆕 カードをスロットに配置（リアルタイム判定版）
        function placeCardInSlot(card, slotIndex) {
            try {
                const slot = document.querySelector(`[data-index="${slotIndex}"]`);
                const term = card.dataset.term;
                const description = card.dataset.description;
                
                // 正解の順序を取得
                const orderArray = CHRONOLOGICAL_ORDERS[gameState.currentOrderKey];
                const correctOrder = orderArray.filter(orderTerm => 
                    gameState.timelineData.some(item => item.term === orderTerm)
                );
                
                // 🎯 リアルタイム判定
                const isCorrect = correctOrder[slotIndex] === term;
                
                // スロットの状態を更新（項目名と説明を両方表示）
                gameState.timelineSlots[slotIndex] = term;
                slot.innerHTML = `
                    <div class="slot-number">${slotIndex + 1}</div>
                    <div class="timeline-slot-term">${term}</div>
                    <div class="timeline-slot-desc">${description}</div>
                `;
                slot.classList.add('filled');
                
                if (isCorrect) {
                    // 🎉 正解処理
                    slot.classList.add('correct');
                    slot.classList.remove('wrong');
                    
                    gameState.timelineScore++;
                    gameState.comboCount++;
                    gameState.maxCombo = Math.max(gameState.maxCombo, gameState.comboCount);
                    
                    // 正解時の豪華演出
                    playInstantCorrectSound();
                    createInstantCorrectEffect(slot);
                    
                    // コンボ表示
                    if (gameState.comboCount >= 3) {
                        createComboDisplay(gameState.comboCount);
                    }
                    
                    // 超高コンボ時の特別演出
                    if (gameState.comboCount >= 5) {
                        createMegaFirework(window.innerWidth / 2, window.innerHeight / 2);
                    }
                } else {
                    // 🚫 不正解処理
                    slot.classList.add('wrong');
                    slot.classList.remove('correct');
                    
                    resetCombo();
                    
                    // 不正解時の演出
                    playInstantWrongSound();
                    createInstantWrongEffect(slot);
                }
                
                // スコア更新
                document.getElementById('timelineScore').textContent = gameState.timelineScore;
                
                // スロットクリック時にカードを元に戻せるようにする
                slot.onclick = () => {
                    removeCardFromSlot(slotIndex, card, isCorrect);
                    playClickSound();
                };
                
                // カードを使用済みに
                card.classList.add('used');
                card.classList.remove('selected');
                gameState.selectedTimelineCard = null;
                
                checkIfAllTimelinePlaced();
            } catch (error) {
                console.error('Error placing card in slot:', error);
            }
        }

        // スロットからカードを取り除く（修正版）
        function removeCardFromSlot(slotIndex, originalCard, wasCorrect) {
            try {
                const slot = document.querySelector(`[data-index="${slotIndex}"]`);
                
                // スコア調整（正解だった場合のみスコアを減らす）
                if (wasCorrect) {
                    gameState.timelineScore = Math.max(0, gameState.timelineScore - 1);
                    document.getElementById('timelineScore').textContent = gameState.timelineScore;
                }
                
                // スロットの状態をリセット
                gameState.timelineSlots[slotIndex] = null;
                slot.innerHTML = `
                    <div class="slot-number">${slotIndex + 1}</div>
                    <div>タップして配置</div>
                `;
                slot.classList.remove('filled', 'correct', 'wrong');
                
                // スロットクリック時の動作を元に戻す
                slot.onclick = () => {
                    if (gameState.selectedTimelineCard && !gameState.timelineSlots[slotIndex]) {
                        placeCardInSlot(gameState.selectedTimelineCard, slotIndex);
                        playClickSound();
                    }
                };
                
                // カードを使用可能状態に戻す
                originalCard.classList.remove('used');
                
                // 完了ボタンを非表示にする
                document.getElementById('finishBtn').style.display = 'none';
                gameState.timelineCompleted = false;
                
                checkIfAllTimelinePlaced();
            } catch (error) {
                console.error('Error removing card from slot:', error);
            }
        }

        // 全て配置されたかチェック（修正版）
        function checkIfAllTimelinePlaced() {
            try {
                const allPlaced = gameState.timelineSlots.every(slot => slot !== null);
                
                if (allPlaced && !gameState.timelineCompleted) {
                    document.getElementById('finishBtn').style.display = 'block';
                    gameState.timelineCompleted = true;
                    
                    // 全配置完了時の演出
                    if (gameState.timelineScore === gameState.timelineData.length) {
                        // パーフェクト達成
                        playPerfectGameSound();
                        createConfetti();
                        
                        setTimeout(() => {
                            createParade();
                        }, 500);
                    } else {
                        // 部分正解
                        playVictoryFanfare();
                    }
                }
            } catch (error) {
                console.error('Error checking timeline placement:', error);
            }
        }

        // 🆕 タイムライン完了処理
        function finishTimelineGame() {
            try {
                setTimeout(() => {
                    showTimelineResult();
                }, 500);
            } catch (error) {
                console.error('Error finishing timeline game:', error);
            }
        }

        // タイムライン結果表示
        function showTimelineResult() {
            try {
                const percentage = Math.round((gameState.timelineScore / gameState.timelineData.length) * 100);
                const endTime = Date.now();
                const playTime = Math.round((endTime - gameState.startTime) / 1000);
                
                if (percentage === 100) {
                    // パーフェクト達成時の最終演出
                    for (let i = 0; i < 20; i++) {
                        setTimeout(() => {
                            createMegaFirework(
                                Math.random() * window.innerWidth,
                                Math.random() * window.innerHeight
                            );
                        }, i * 200);
                    }
                    
                    document.getElementById('finalScore').textContent = 
                        `🏆 パーフェクト！ 🏆\n${gameState.timelineScore}/${gameState.timelineData.length}問全問正解！\n⏱️ タイム: ${playTime}秒`;
                } else if (percentage >= 80) {
                    createConfetti();
                    
                    document.getElementById('finalScore').textContent = 
                        `🌟 すばらしい！ 🌟\n${gameState.timelineScore}/${gameState.timelineData.length}問正解！ (${percentage}%)\n⏱️ タイム: ${playTime}秒`;
                } else if (percentage >= 60) {
                    document.getElementById('finalScore').textContent = 
                        `👍 よくできました！ 👍\n${gameState.timelineScore}/${gameState.timelineData.length}問正解！ (${percentage}%)\n⏱️ タイム: ${playTime}秒`;
                } else {
                    document.getElementById('finalScore').textContent = 
                        `📚 もう一度チャレンジ！ 📚\n${gameState.timelineScore}/${gameState.timelineData.length}問正解！ (${percentage}%)\n⏱️ タイム: ${playTime}秒`;
                }
                
                showScreen('resultScreen');
            } catch (error) {
                console.error('Error showing timeline result:', error);
            }
        }

        // マッチングゲーム描画
        function renderMatchingGame() {
            try {
                console.log('Rendering matching game with data:', gameState.currentData);
                const leftColumn = document.getElementById('leftColumn');
                const rightColumn = document.getElementById('rightColumn');
                
                leftColumn.innerHTML = '';
                rightColumn.innerHTML = '';
                
                const terms = shuffleArray(gameState.currentData.map(item => item.term));
                const descriptions = shuffleArray(gameState.currentData.map(item => item.description));
                
                console.log('Terms:', terms);
                console.log('Descriptions:', descriptions);
                
                terms.forEach((term, index) => {
                    const card = createCard(term, 'term', index);
                    leftColumn.appendChild(card);
                });
                
                descriptions.forEach((desc, index) => {
                    const card = createCard(desc, 'description', index);
                    rightColumn.appendChild(card);
                });
            } catch (error) {
                console.error('Error rendering matching game:', error);
            }
        }

        // カード作成
        function createCard(text, type, index) {
            try {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<div class="card-text">${text}</div>`;
                card.dataset.type = type;
                card.dataset.text = text;
                card.onclick = () => selectCard(card);
                
                card.style.animationDelay = (Math.random() * 0.5) + 's';
                card.style.animation = 'bounce 0.6s ease-out forwards';
                
                return card;
            } catch (error) {
                console.error('Error creating card:', error);
                return document.createElement('div'); // フォールバック
            }
        }

        // カード選択
        function selectCard(card) {
            try {
                playClickSound();
                
                if (card.classList.contains('matched')) return;
                
                if (gameState.selectedCard) {
                    if (gameState.selectedCard === card) {
                        gameState.selectedCard.classList.remove('selected');
                        gameState.selectedCard = null;
                        return;
                    }
                    
                    checkMatch(gameState.selectedCard, card);
                } else {
                    card.classList.add('selected');
                    gameState.selectedCard = card;
                }
            } catch (error) {
                console.error('Error selecting card:', error);
            }
        }

        // マッチング判定（修正版：スコアポップアップを削除）
        function checkMatch(card1, card2) {
            try {
                const text1 = card1.dataset.text;
                const text2 = card2.dataset.text;
                
                let isMatch = false;
                for (let item of gameState.currentData) {
                    if ((item.term === text1 && item.description === text2) || 
                        (item.term === text2 && item.description === text1)) {
                        isMatch = true;
                        break;
                    }
                }
                
                if (isMatch) {
                    // 🎯 正解処理
                    card1.classList.remove('selected');
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    
                    gameState.score++;
                    gameState.matchedPairs++;
                    
                    // コンボ処理
                    handleCorrectMatch();
                    
                    // 音響とエフェクト
                    playUltraSuccessSound();
                    playMegaApplauseSound();
                    
                    const rect1 = card1.getBoundingClientRect();
                    const rect2 = card2.getBoundingClientRect();
                    
                    // 超豪華エフェクト
                    createMegaSuccessEffect(rect1.left + rect1.width / 2, rect1.top + rect1.height / 2);
                    createMegaSuccessEffect(rect2.left + rect2.width / 2, rect2.top + rect2.height / 2);
                    
                    // 既存の花火も維持
                    createFirework(rect1.left + rect1.width / 2, rect1.top + rect1.height / 2);
                    createFirework(rect2.left + rect2.width / 2, rect2.top + rect2.height / 2);
                    
                    document.getElementById('score').textContent = gameState.score;
                    const progress = (gameState.matchedPairs / gameState.totalPairs) * 100;
                    document.getElementById('progressFill').style.width = progress + '%';
                    
                    if (gameState.matchedPairs === gameState.totalPairs) {
                        setTimeout(showResult, 1500);
                    }
                } else {
                    // 🚫 不正解処理
                    resetCombo();
                    
                    card1.classList.add('wrong');
                    card2.classList.add('wrong');
                    
                    playWrongSound();
                    
                    // 画面シェイク
                    document.body.classList.add('screen-shake');
                    setTimeout(() => document.body.classList.remove('screen-shake'), 500);
                    
                    setTimeout(() => {
                        card1.classList.remove('selected', 'wrong');
                        card2.classList.remove('wrong');
                    }, 800);
                }
                
                gameState.selectedCard = null;
            } catch (error) {
                console.error('Error checking match:', error);
            }
        }

        // 結果表示（究極改良版）
        function showResult() {
            try {
                if (gameState.gameMode === 'matching') {
                    const endTime = Date.now();
                    const playTime = Math.round((endTime - gameState.startTime) / 1000);
                    const percentage = Math.round((gameState.score / gameState.totalPairs) * 100);
                    
                    if (percentage === 100 && gameState.perfectRun) {
                        // 🏆 パーフェクトゲーム
                        playPerfectGameSound();
                        
                        // 超豪華演出
                        for (let i = 0; i < 30; i++) {
                            setTimeout(() => {
                                createMegaFirework(
                                    Math.random() * window.innerWidth,
                                    Math.random() * window.innerHeight
                                );
                            }, i * 100);
                        }
                        
                        createConfetti();
                        createParade();
                        
                        // 画面全体エフェクト
                        for (let i = 0; i < 10; i++) {
                            setTimeout(() => {
                                createMegaSuccessEffect(window.innerWidth / 2, window.innerHeight / 2);
                            }, i * 300);
                        }
                        
                        document.getElementById('finalScore').textContent = 
                            `🏆 パーフェクト！ 🏆\n${gameState.score}/${gameState.totalPairs}問全問正解！\n⏱️ タイム: ${playTime}秒`;
                    } else if (percentage >= 90) {
                        // 🌟 素晴らしい成績
                        playVictoryFanfare();
                        createConfetti();
                        createParade();
                        
                        for (let i = 0; i < 15; i++) {
                            setTimeout(() => {
                                createFirework(
                                    Math.random() * window.innerWidth,
                                    Math.random() * window.innerHeight
                                );
                            }, i * 200);
                        }
                        
                        document.getElementById('finalScore').textContent = 
                            `🌟 すばらしい！ 🌟\n${gameState.score}/${gameState.totalPairs}問正解！ (${percentage}%)\n⏱️ タイム: ${playTime}秒`;
                    } else if (percentage >= 70) {
                        // 👍 良い成績
                        playUltraSuccessSound();
                        createConfetti();
                        
                        for (let i = 0; i < 8; i++) {
                            setTimeout(() => {
                                createFirework(
                                    Math.random() * window.innerWidth,
                                    Math.random() * window.innerHeight
                                );
                            }, i * 300);
                        }
                        
                        document.getElementById('finalScore').textContent = 
                            `👍 よくできました！ 👍\n${gameState.score}/${gameState.totalPairs}問正解！ (${percentage}%)\n⏱️ タイム: ${playTime}秒`;
                    } else {
                        // 📚 がんばろう
                        playClickSound();
                        
                        document.getElementById('finalScore').textContent = 
                            `📚 もう一度チャレンジ！ 📚\n${gameState.score}/${gameState.totalPairs}問正解！ (${percentage}%)\n⏱️ タイム: ${playTime}秒`;
                    }
                }
                
                showScreen('resultScreen');
                document.querySelector('.result-content').classList.add('celebrate');
            } catch (error) {
                console.error('Error showing result:', error);
            }
        }

        // ゲーム再開
        function restartGame() {
            try {
                if (gameState.gameMode === 'matching') {
                    startMatchingGame();
                } else if (gameState.gameMode === 'timeline') {
                    startTimelineGame();
                }
            } catch (error) {
                console.error('Error restarting game:', error);
            }
        }

        // ページロード時の初期化（エラーハンドリング強化）
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Page loaded, initializing...');
            
            try {
                // データが読み込まれるまで少し待つ
                setTimeout(() => {
                    if (typeof REKISHI_DATA !== 'undefined') {
                        initializeMenu();
                        showMenu();
                    } else {
                        console.error('REKISHI_DATA not loaded, retrying...');
                        // 再試行
                        setTimeout(() => {
                            if (typeof REKISHI_DATA !== 'undefined') {
                                initializeMenu();
                                showMenu();
                            } else {
                                console.error('REKISHI_DATA failed to load');
                                // エラー表示
                                document.querySelector('.container').innerHTML = `
                                    <div style="text-align: center; padding: 40px; color: var(--primary);">
                                        <h3 style="font-family: var(--font-serif); margin-bottom: 8px;">データファイルの読み込みに失敗しました</h3>
                                        <p style="color: var(--text-muted);">データファイルを確認してください</p>
                                        <button onclick="location.reload()" style="margin-top: 20px; padding: 11px 24px; background: var(--primary); color: #f5f0e8; border: none; border-radius: 25px; font-weight: bold; cursor: pointer;">再読み込み</button>
                                    </div>
                                `;
                            }
                        }, 1000);
                    }
                }, 100);
                
                // ユーザーインタラクションで音声を有効化
                document.addEventListener('click', initAudio, { once: true });
                document.addEventListener('touchstart', initAudio, { once: true });
            } catch (error) {
                console.error('Error during initialization:', error);
            }
        });
    </script>
</body>
</html>
